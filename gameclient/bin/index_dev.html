    <script>

        function taptapTrack(eventName, param) {
            let s = param ? JSON.stringify(param) : "";
            console.log(`taptapTrack:${eventName}${s}`);
            // this.actionFunc(eventName,param);
            let _sdk = window['Y1YSDK'];
            if (_sdk) {
                _sdk.syTapTapAndroidAction('tapTapSendEvent', eventName, param);
            }
        }

        var loadingBar = document.getElementById("loadingBar");
        loadingBar.style.transform = "scale(0.3,1)";

		console.log("页面开始加载:"+(new Date().toString())+"     =======================================>");
	
        window['refreshweb']= setTimeout(() => {
            location.href = "";
        },15000);



        function loadLib(url,param,notRandom) {
            var script = document.createElement("script");
            script.async = false;
            if(param){
                script.src = url + "?" + param;
            }else{
                script.src = notRandom ? url : (url + "?" + Math.random());
            }
            document.body.appendChild(script);
        }
        function getVal(string) {
            if (window.location && window.location.search) {
                let reg = new RegExp("(^|&)" + string + "=([^&]*)(&|$)");
                let r = window.location.search.substr(1).match(reg);
                if (r) {
                    return decodeURI(r[2]);
                }
            }
        }
        let _configFile = getVal("config");
        let _initConfigfile = 'initconfig.js';//'initconfig.js';
        if(_configFile){
            _initConfigfile = `${_configFile}.js`;
        }
        loadLib(_initConfigfile);
        //==========================================================
        let curTimeScale = getVal("timeScale");
        if(curTimeScale!=undefined){
            (function() {
                let timeScale = curTimeScale || 1;
                let originalNow = Date.now;
            
                Date.now = function() {
                    return originalNow() * timeScale;
                };
            
                console.log(Date.now()); 
            })();
        }
        //==========================================================
        function parseJs(f, data) {
            taptapTrack("start_parseJs");
            // console.log("start parseJs");
            var zip = new JSZip(data);
            //console.log(data);
            //console.log(zip);//,zip.file("main.min.js")
            if (zip.file(f + ".js") == undefined) {
                console.log("无法找到" + f + ".js", zip);
                return;
            }
            var text = zip.file(f + ".js").asText();
            if (window.execScript) {
                window.execScript(text);
                console.log(0);
                // window.onload(f);
                return;
            } else if (window["eval"]) {
                window["eval"].call(window, text);
                // window.onload(f);
                return;
            } else {
                var script = document.createElement('script');
                script.setAttribute('type', "text/javascript");
                script.text = text;
                document.body.appendChild(script);
                // window.onload(f);
                document.body.removeChild(script);
            }
        }
        function loadzip(f,path, callBack,useCache) {
            taptapTrack("loadzip_start");
            var newurl = "";
            if(useCache){
                newurl=path;
            }else{
                newurl=(path + "?ver=" + Math.random());
            }

            JSZipUtils.getBinaryContent(newurl, function (err, data) {
                if (!err) {
                    if (callBack) {
                        callBack();
                    }
                    parseJs(f, data);
                } else {
                    taptapTrack("loadzip_err");
                }
            });
        }
        
        function checkVConsole() {
                setTimeout(() => {
                    if (typeof VConsole != "undefined") {
                        let vConsole = new VConsole();
                        console.log(`href: ${window.location.href}`);
                    } else {
                        checkVConsole();
                    }
                }, 1000);
            }
        // loadzip("AgoraRTC_N-4.14.0","libs/AgoraRTC_N-4.14.0.bin",()=>{
        loadLib("js/gamelib.js");

		function checkConfig() {
			var c = window["initConfig"];
			if (c && typeof thinkingdata != "undefined" && window["ButtonCtl"]){
                //  && typeof QuickSDK!= "undefined") {
                // if(getVal("vConsole")){
                // if(c.vConsole){
                //     let vConsole = new VConsole();
                // }

                
                var platform = c.platform;
                console.log((new Date().toString())+"platform is:" + platform);
                if(c.debug){
                    loadLib("libs/vconsole.min.js");
                    checkVConsole();
                }
                switch(platform){
                    case 2:
                    case 5:
                    case 10:
                        loadLib("//docater1.cn/tpl/User/default/js/jquery-2.1.4.min.js",undefined,true);
                        // loadLib("libs/min/jquery1.4.1.mini.js",undefined,true);
                        loadLib("//docater1.cn/tpl/User/default/js/sdk.js");
                        // initThinkingdata(c.ttappid);

                        function checkDocInit(){
                            let _sdk = window['Y1YSDK'];
                            if(_sdk){
                                console.log("out taptapInit syTapTapAndroidAction...");
                                if(_sdk.syTapTapAndroidAction){
                                    _sdk.syTapTapAndroidAction("gameInit").then((data) => {
                                    });
                                }
                            }else{
                                setTimeout(checkDocInit, 50);
                                // console.log('loadY1YSDK');
                            }
                        }
                        checkDocInit();
                        break;
                    case 4:
                        loadLib("https://h5.8uyx.com/public/sdk/game8u.js","t=" + Date.now());
                        // initThinkingdata(c.ttappid);
                        break;
                    case 8:
                        //quick
                        break;
                    default:
                        break;
                }

                if(c["littlegame"]){
				    loadLib("js/littlegame0.js");//前置小游戏
                }
                let file = "bundle";
                if(c.bundle){
                    file = c.bundle;
                }
                console.log('file:'+file);
                //  loadLib("js/gamelib.js");                
                if(c.bundlebin){
					var name1=c.bundlebin;
                    loadzip(name1,"js/dev/"+name1+".bin");
                }else{
				    loadLib("js/"+file+".js");
                }
            } else {
				setTimeout(checkConfig, 50);
			}
		}
		checkConfig();
        // },true);
      
    </script>
